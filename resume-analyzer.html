<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Resume Analyzer & Job Recommender</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e2e2dc;--ac:#2d5be3;--ok:#1e8a4c;--wa:#b7791f;--bad:#c23b3b;--chip:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--card:#202026;--tx:#ececf0;--mu:#9a9aa5;--bd:#33333c;--ac:#7c9bff;--ok:#4cc27f;--wa:#e0b052;--bad:#ef7676;--chip:#2a2f4a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 4px}p.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:14px/1.5 inherit;resize:vertical}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd);margin-left:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center}
.score{font-size:42px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0 10px}.bar>i{display:block;height:100%;background:var(--ac)}
.chip{display:inline-block;background:var(--chip);color:var(--ac);border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0;font-size:13px}
.chip.miss{background:transparent;border:1px dashed var(--bd);color:var(--mu)}
.job h3{margin:0;font-size:17px}.job .m{color:var(--mu);font-size:13px}.pct{float:right;font-weight:700}
ul{margin:6px 0 0;padding-left:20px}li{margin:3px 0}.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.hide{display:none}h2{font-size:17px;margin:0 0 10px}
</style></head><body><main>
<h1>AI Resume Analyzer & Job Recommender</h1>
<p class="sub">Paste your resume text. Everything runs in your browser — nothing is uploaded.</p>
<div class="card">
<textarea id="t" placeholder="Paste resume text here..."></textarea>
<div class="row"><button id="go">Analyze resume</button><button class="ghost" id="ex">Load sample</button></div>
</div>
<div id="out" class="hide">
<div class="grid">
<div class="card"><h2>Resume score</h2><div class="score" id="sc"></div><div class="bar"><i id="scb"></i></div><div id="chk"></div></div>
<div class="card"><h2>Skills detected</h2><div id="sk"></div></div>
</div>
<div class="card"><h2>Suggestions</h2><ul id="sg"></ul></div>
<h2>Recommended jobs</h2><div id="jobs"></div>
</div>
</main>
<script>
const SK={
"Programming":["python","java","javascript","typescript","c++","c#","go","rust","sql","r","php","kotlin","swift","scala"],
"Web":["react","angular","vue","node.js","html","css","django","flask","spring","express","next.js","rest","graphql"],
"Data & AI":["machine learning","deep learning","nlp","pandas","numpy","scikit-learn","tensorflow","pytorch","statistics","tableau","power bi","excel","data analysis","data visualization","spark","llm"],
"Cloud & DevOps":["aws","azure","gcp","docker","kubernetes","git","ci/cd","linux","terraform","jenkins"],
"Databases":["mysql","postgresql","mongodb","redis","nosql"],
"Soft":["leadership","communication","teamwork","agile","scrum","problem solving","project management"]};
const JOBS=[
{t:"Data Scientist",d:"Build predictive models and extract insight from data.",s:["python","machine learning","statistics","pandas","sql","scikit-learn","data visualization"]},
{t:"Machine Learning Engineer",d:"Train, ship and monitor ML systems.",s:["python","tensorflow","pytorch","deep learning","docker","git","aws","machine learning"]},
{t:"NLP / LLM Engineer",d:"Work on language models and text pipelines.",s:["python","nlp","pytorch","llm","deep learning","git","docker"]},
{t:"Data Analyst",d:"Turn data into dashboards and decisions.",s:["sql","excel","tableau","power bi","data analysis","python","statistics","communication"]},
{t:"Frontend Developer",d:"Build fast, accessible user interfaces.",s:["javascript","react","html","css","typescript","git","rest"]},
{t:"Backend Developer",d:"Design APIs and services.",s:["python","java","node.js","sql","rest","docker","git","postgresql"]},
{t:"Full Stack Developer",d:"Own features from UI to database.",s:["javascript","react","node.js","sql","html","css","git","mongodb","rest"]},
{t:"DevOps Engineer",d:"Automate builds, infrastructure and deployment.",s:["linux","docker","kubernetes","aws","ci/cd","terraform","git","jenkins"]},
{t:"Cloud Engineer",d:"Design and run cloud infrastructure.",s:["aws","azure","gcp","terraform","docker","linux","kubernetes"]},
{t:"Android / Mobile Developer",d:"Create mobile apps.",s:["kotlin","java","swift","git","rest","agile"]},
{t:"Project Manager",d:"Lead delivery across teams.",s:["project management","agile","scrum","leadership","communication","excel"]}];
const VERBS="led built developed designed implemented created managed improved increased reduced launched optimized automated delivered analyzed deployed architected mentored achieved".split(" ");
const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
const has=(txt,k)=>new RegExp("(^|[^a-z0-9+#])"+esc(k)+"($|[^a-z0-9+#])","i").test(txt);
function analyze(){
 const raw=document.getElementById("t").value.trim(); if(raw.length<40){alert("Please paste more resume text.");return}
 const txt=raw.toLowerCase(), found=new Set(), byCat={};
 for(const c in SK){SK[c].forEach(k=>{if(has(txt,k)){found.add(k);(byCat[c]=byCat[c]||[]).push(k)}})}
 const words=raw.split(/\s+/).length;
 const checks=[
  ["Email address",/[\w.+-]+@[\w-]+\.[\w.]+/.test(raw),8],
  ["Phone number",/(\+?\d[\d\s().-]{8,}\d)/.test(raw),5],
  ["Education section",/education|university|college|b\.?tech|bachelor|master|b\.?sc|m\.?sc/i.test(raw),12],
  ["Experience section",/experience|intern|employment|worked at/i.test(raw),15],
  ["Skills section",/skills|technologies|tech stack/i.test(raw),10],
  ["Projects section",/project/i.test(raw),10],
  ["Summary / objective",/summary|objective|profile|about me/i.test(raw),5],
  ["Quantified achievements (numbers/%)",/\d+\s?%|\b\d{2,}\+?\s?(users|customers|clients|records|requests|projects)|\$\s?\d+|increased|reduced/i.test(raw),10],
  ["Links (LinkedIn / GitHub)",/linkedin\.com|github\.com/i.test(raw),5],
  ["Good length (150–800 words)",words>=150&&words<=800,5]];
 let score=checks.reduce((a,c)=>a+(c[1]?c[2]:0),0);
 const verbs=VERBS.filter(v=>has(txt,v)||has(txt,v.replace(/ed$/,"e")+"d")).length;
 const vs=Math.min(verbs,5)*3; score+=vs; score=Math.min(100,score);
 const col=score>=75?"ok":score>=50?"wa":"bad";
 const sc=document.getElementById("sc");sc.textContent=score+"/100";sc.className="score "+col;
 document.getElementById("scb").style.width=score+"%";
 document.getElementById("chk").innerHTML=checks.map(c=>`<div class="${c[1]?"ok":"bad"}">${c[1]?"✓":"✗"} ${c[0]}</div>`).join("")+`<div class="${verbs>=4?"ok":"wa"}">${verbs>=4?"✓":"•"} Action verbs used: ${verbs}</div>`;
 document.getElementById("sk").innerHTML=found.size?Object.keys(byCat).map(c=>`<div style="margin-bottom:8px"><b>${c}</b><br>${byCat[c].map(k=>`<span class="chip">${k}</span>`).join("")}</div>`).join(""):"<span class='bad'>No known skills detected. Add a clear Skills section.</span>";
 const tips=[];
 checks.forEach(c=>{if(!c[1])tips.push("Add or improve: "+c[0].toLowerCase()+".")});
 if(verbs<4)tips.push("Start bullet points with strong action verbs (built, led, optimized...).");
 if(found.size<8)tips.push("List more relevant technical skills — only "+found.size+" recognised.");
 if(!tips.length)tips.push("Strong resume! Tailor keywords to each job description.");
 document.getElementById("sg").innerHTML=tips.map(t=>`<li>${t}</li>`).join("");
 const ranked=JOBS.map(j=>{const m=j.s.filter(k=>found.has(k)),x=j.s.filter(k=>!found.has(k));return{...j,m,x,p:Math.round(m.length/j.s.length*100)}}).sort((a,b)=>b.p-a.p).slice(0,5);
 document.getElementById("jobs").innerHTML=ranked.map(j=>`<div class="card job"><span class="pct ${j.p>=70?"ok":j.p>=40?"wa":"bad"}">${j.p}% match</span><h3>${j.t}</h3><div class="m">${j.d}</div><div class="bar"><i style="width:${j.p}%"></i></div>${j.m.map(k=>`<span class="chip">${k}</span>`).join("")}${j.x.map(k=>`<span class="chip miss">+ ${k}</span>`).join("")}</div>`).join("");
 document.getElementById("out").classList.remove("hide");
 document.getElementById("out").scrollIntoView({behavior:"smooth"});
}
document.getElementById("go").onclick=analyze;
document.getElementById("ex").onclick=()=>{document.getElementById("t").value=`Priya Sharma | priya@example.com | +91 98765 43210 | github.com/priya
Summary: Data-focused engineer with an interest in NLP.
Education: B.Tech Computer Science, Delhi University, 2025
Skills: Python, SQL, pandas, numpy, scikit-learn, TensorFlow, NLP, Git, Docker, Tableau, Excel
Experience: Data Science Intern at Acme Analytics. Built a churn model that improved retention by 12%. Automated reporting pipelines and reduced manual work by 30%. Developed dashboards used by 40+ clients.
Projects: Resume classifier using NLP and machine learning. Designed a Flask REST API and deployed with Docker. Analyzed 50000 records using statistics and data visualization.`};
</script></body></html>
